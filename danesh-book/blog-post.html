<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطلب وبلاگ | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content" id="postRoot" style="max-width:800px;"></main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  try { CATEGORIES = await fetchCategories(); } catch (e) { /* قابل چشم‌پوشی */ }
  renderLayout("blog");

  const slug = new URLSearchParams(window.location.search).get("slug");
  const root = document.getElementById("postRoot");
  try {
    const post = await fetchPost(slug);
    document.title = post.title + " | دانش بوک";
    root.innerHTML = `
      <div class="breadcrumb"><a href="index.html">خانه</a> / <a href="blog.html">وبلاگ</a> / ${post.title}</div>
      <div style="width:100%; height:180px; border-radius:var(--radius); background:linear-gradient(135deg, ${post.cover_color}, #16222b); display:flex; align-items:center; justify-content:center; font-size:50px; margin-bottom:20px;">✍️</div>
      <h1>${post.title}</h1>
      <p style="color:var(--color-text-light); font-size:13px;">تاریخ انتشار: ${post.published_at}</p>
      <div style="line-height:2.1; font-size:15.5px; margin-top:16px;">${post.content}</div>
      <a href="blog.html" class="btn btn-outline" style="margin-top:30px;">← بازگشت به وبلاگ</a>
    `;
  } catch (e) {
    root.innerHTML = `<div class="empty-state"><div class="ico">❌</div><p>این مطلب پیدا نشد.</p><a href="blog.html" class="btn btn-primary">بازگشت به وبلاگ</a></div>`;
  }
})();
</script>
</body>
</html>
