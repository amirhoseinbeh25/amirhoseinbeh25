<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>مطلب وبلاگ | دانش بوک</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=ed8bbddf">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content" id="postRoot">
  <div class="page-loading">در حال بارگذاری...</div>
</main>

<div id="site-footer"></div>

<script src="js/data.js?v=01b60733"></script>
<script src="js/api.js?v=c165e67f"></script>
<script src="js/app.js?v=4a2e24d2"></script>
<script src="js/layout.js?v=490623c1"></script>
<script>
(async () => {
  const slug = new URLSearchParams(window.location.search).get("slug") || "";
  const postPromise = fetchPost(slug).catch(() => null);
  await initPage("blog");

  const root = document.getElementById("postRoot");
  const post = await postPromise;
  if (!post) {
    root.innerHTML = `<div class="empty-state"><div class="ico">❌</div><p>این مطلب پیدا نشد.</p><a href="blog.html" class="btn btn-primary">بازگشت به وبلاگ</a></div>`;
    return;
  }
  document.title = `${post.title} | ${setting("site_name", "دانش بوک")}`;
  const img = safeImageUrl(post.cover_image);
  const cover = img
    ? `background-image:${cssUrl(img)}`
    : `background:linear-gradient(135deg, ${hexToRgba(post.cover_color, 1)}, #16222b)`;
  root.innerHTML = `
    <div class="breadcrumb"><a href="index.html">خانه</a> / <a href="blog.html">وبلاگ</a> / ${esc(post.title)}</div>
    <article style="max-width:820px;">
      <div class="post-hero" style="${esc(cover)}">${img ? "" : "✍️"}</div>
      <h1 style="margin:0 0 6px;">${esc(post.title)}</h1>
      <p style="color:var(--color-text-light); font-size:13px; margin:0 0 16px;">تاریخ انتشار: ${esc(post.published_at)}</p>
      <div class="rich-text">${renderRichText(post.content)}</div>
    </article>
    <a href="blog.html" class="btn btn-outline" style="margin-top:30px;">→ بازگشت به وبلاگ</a>
  `;
})();
</script>
</body>
</html>
