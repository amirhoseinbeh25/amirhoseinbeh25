<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتیجه پرداخت | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div id="resultRoot"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  try { CATEGORIES = await fetchCategories(); } catch (e) { /* قابل چشم‌پوشی */ }
  renderLayout();

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order");
  const status = params.get("status");
  const root = document.getElementById("resultRoot");

  let order = null;
  if (orderId) { try { order = await fetchPaymentStatus(orderId); } catch (e) { /* قابل چشم‌پوشی */ } }

  if (status === "success") {
    root.innerHTML = `
      <div class="empty-state">
        <div class="ico">✅</div>
        <p>پرداخت سفارش <b>#${orderId}</b> با موفقیت انجام شد.${order ? ` مبلغ پرداخت‌شده: <b>${formatPrice(order.total)}</b>` : ""}</p>
        <p style="color:var(--color-text-light); font-size:13.5px;">سفارش شما در حال پردازش است و به‌زودی ارسال می‌شود.</p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
          <a href="account.html" class="btn btn-primary">مشاهده سفارش‌های من</a>
          <a href="shop.html" class="btn btn-outline">ادامه خرید</a>
        </div>
      </div>`;
  } else {
    root.innerHTML = `
      <div class="empty-state">
        <div class="ico">❌</div>
        <p>پرداخت سفارش ${orderId ? "#" + orderId : ""} انجام نشد یا لغو شد.</p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
          <a href="cart.html" class="btn btn-primary">بازگشت به سبد خرید</a>
          <a href="shop.html" class="btn btn-outline">ادامه خرید</a>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
