<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>وبلاگ آموزشی | دانش بوک</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=ed8bbddf">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / وبلاگ آموزشی</div>
  <h1 class="page-title">✍️ وبلاگ آموزشی</h1>
  <p class="page-subtitle" style="max-width:700px;">نکات برنامه‌ریزی درسی، روش مطالعه و راهنمای انتخاب رشته برای دانش‌آموزان و داوطلبان کنکور.</p>
  <div class="post-grid" id="postsGrid" style="margin-top:24px;"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js?v=01b60733"></script>
<script src="js/api.js?v=c165e67f"></script>
<script src="js/app.js?v=4a2e24d2"></script>
<script src="js/layout.js?v=490623c1"></script>
<script>
(async () => {
  const postsPromise = fetchPosts();
  await initPage("blog");
  const grid = document.getElementById("postsGrid");
  try {
    const posts = await postsPromise;
    grid.innerHTML = posts.length
      ? posts.map(postCardHTML).join("")
      : `<div class="empty-state" style="grid-column:1/-1;"><div class="ico">✍️</div><p>هنوز مطلبی منتشر نشده است.</p></div>`;
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ico">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
