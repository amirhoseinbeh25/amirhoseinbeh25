<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وبلاگ آموزشی | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / وبلاگ آموزشی</div>
  <h1>✍️ وبلاگ آموزشی دانش بوک</h1>
  <p style="max-width:700px; color:var(--color-text-light);">نکات برنامه‌ریزی درسی، روش مطالعه و راهنمای انتخاب رشته برای دانش‌آموزان و داوطلبان کنکور.</p>
  <div class="info-grid" id="postsGrid" style="grid-template-columns:repeat(3,1fr); margin-top:24px;"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  try {
    CATEGORIES = await fetchCategories();
    const posts = await fetchPosts();
    renderLayout("blog");
    document.getElementById("postsGrid").innerHTML = posts.length ? posts.map(p => `
      <a href="blog-post.html?slug=${p.slug}" class="info-card" style="text-align:right; display:block;">
        <div style="width:100%; height:120px; border-radius:10px; background:linear-gradient(135deg, ${p.cover_color}, #16222b); display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:14px;">✍️</div>
        <h3 style="margin:0 0 8px;">${p.title}</h3>
        <p style="color:var(--color-text-light); font-size:13.5px;">${p.excerpt || ""}</p>
      </a>
    `).join("") : `<div class="empty-state"><div class="ico">✍️</div><p>هنوز مطلبی منتشر نشده است.</p></div>`;
  } catch (e) {
    document.querySelector("main").innerHTML = `<div class="empty-state"><div class="ico">⚠️</div><p>${e.message}</p></div>`;
  }
})();
</script>
</body>
</html>
