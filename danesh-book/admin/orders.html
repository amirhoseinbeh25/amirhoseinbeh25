<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>سفارش‌ها | پنل ادمین دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="admin-topbar"></div>
    <div class="content">

      <div class="panel">
        <div class="toolbar">
          <input type="search" id="searchBox" placeholder="جست‌وجو: شماره سفارش، نام یا موبایل...">
          <select id="statusFilter">
            <option value="">همه وضعیت‌ها</option>
            <option value="pending">در انتظار بررسی</option>
            <option value="processing">در حال پردازش</option>
            <option value="shipped">ارسال‌شده</option>
            <option value="delivered">تحویل‌شده</option>
            <option value="cancelled">لغو‌شده</option>
          </select>
          <span id="orderCount" style="color:var(--color-text-light); font-size:13px;"></span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>شماره سفارش</th><th>مشتری</th><th>تماس</th><th>تعداد اقلام</th><th>مبلغ کل</th><th>پرداخت</th><th>وضعیت</th><th>تاریخ</th><th></th></tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <h2>جزئیات سفارش #<span id="om_id"></span></h2>
    <p style="font-size:13.5px; color:var(--color-text-light);">
      مشتری: <b id="om_name"></b> — تماس: <b id="om_phone"></b><br>
      آدرس: <span id="om_address"></span><br>
      وضعیت پرداخت: <b id="om_payment"></b>
    </p>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>کالا</th><th>قیمت واحد</th><th>تعداد</th><th>جمع</th></tr></thead>
        <tbody id="om_items"></tbody>
      </table>
    </div>
    <p id="om_totals" style="font-size:13.5px; margin:10px 0 0;"></p>

    <h3 style="font-size:14px; margin:16px 0 6px;">📨 اعلان‌های ارسال‌شده (شبیه‌سازی‌شده)</h3>
    <div id="om_notifications" style="font-size:12.5px; color:var(--color-text-light); max-height:120px; overflow-y:auto;"></div>

    <div class="form-grid" style="grid-template-columns:1fr; margin-top:16px;">
      <div>
        <label>تغییر وضعیت سفارش</label>
        <select id="om_status">
          <option value="pending">در انتظار بررسی</option>
          <option value="processing">در حال پردازش</option>
          <option value="shipped">ارسال‌شده</option>
          <option value="delivered">تحویل‌شده</option>
          <option value="cancelled">لغو‌شده</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="closeOrderModalBtn">بستن</button>
      <button type="button" class="btn btn-primary" id="updateStatusBtn">به‌روزرسانی وضعیت</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script>
(async () => {
  renderAdminShell("orders", "سفارش‌ها");

  const STATUS_LABELS = {
    pending: "در انتظار بررسی", processing: "در حال پردازش",
    shipped: "ارسال‌شده", delivered: "تحویل‌شده", cancelled: "لغو‌شده"
  };

  let orders = [];
  const modal = document.getElementById("orderModal");
  let activeOrderId = null;

  function renderTable() {
    const statusFilter = document.getElementById("statusFilter").value;
    const q = document.getElementById("searchBox").value.trim().replace(/^#/, "").toLowerCase();
    const filtered = orders.filter(o =>
      (!statusFilter || o.status === statusFilter) &&
      (!q || String(o.id) === q || `${o.customer_name} ${o.phone}`.toLowerCase().includes(q)));
    document.getElementById("orderCount").textContent = `${filtered.length.toLocaleString("fa-IR")} سفارش`;

    document.getElementById("ordersBody").innerHTML = filtered.length
      ? filtered.map(o => `
        <tr>
          <td>#${Number(o.id)}</td>
          <td>${esc(o.customer_name)}</td>
          <td><a href="${esc(telHref(o.phone))}">${esc(o.phone)}</a></td>
          <td>${Number(o.itemCount)}</td>
          <td>${formatPrice(o.total)}</td>
          <td><span class="badge ${o.payment_status === "paid" ? "stock-ok" : "stock-low"}">${o.payment_status === "paid" ? "پرداخت‌شده" : "پرداخت‌نشده"}</span></td>
          <td><span class="badge ${esc(o.status)}">${STATUS_LABELS[o.status] || esc(o.status)}</span></td>
          <td style="white-space:nowrap;">${esc(o.created_at)}</td>
          <td><button class="btn btn-outline btn-sm" data-act="view" data-id="${Number(o.id)}">جزئیات</button></td>
        </tr>`).join("")
      : `<tr class="empty-row"><td colspan="9">سفارشی پیدا نشد.</td></tr>`;

    document.querySelectorAll('[data-act="view"]').forEach(b =>
      b.addEventListener("click", () => openOrder(Number(b.dataset.id))));
  }

  async function loadAll() {
    orders = await adminApi("/orders");
    renderTable();
  }

  async function openOrder(id) {
    try {
      const order = await adminApi("/orders/" + id);
      activeOrderId = id;
      document.getElementById("om_id").textContent = order.id;
      document.getElementById("om_name").textContent = order.customer_name;
      document.getElementById("om_phone").textContent = order.phone;
      document.getElementById("om_address").textContent = order.address || "—";
      document.getElementById("om_payment").textContent = order.payment_status === "paid" ? "پرداخت‌شده ✓" : "پرداخت‌نشده";
      document.getElementById("om_status").value = order.status;
      document.getElementById("om_items").innerHTML = order.items.map(it => `
        <tr>
          <td>${esc(it.title)}</td>
          <td>${formatPrice(it.price)}</td>
          <td>${Number(it.qty)}</td>
          <td>${formatPrice(it.price * it.qty)}</td>
        </tr>`).join("");
      document.getElementById("om_totals").innerHTML =
        `جمع کالاها: <b>${formatPrice(order.subtotal)}</b> — ارسال: <b>${order.shipping ? formatPrice(order.shipping) : "رایگان"}</b> — مبلغ کل: <b>${formatPrice(order.total)}</b>`;
      document.getElementById("om_notifications").innerHTML = (order.notifications && order.notifications.length)
        ? order.notifications.map(n => `<div>📨 [${n.channel === "sms" ? "پیامک" : "ایمیل"}] ${esc(n.recipient)} — ${esc(n.message)} <small>(${esc(n.created_at)})</small></div>`).join("")
        : "هنوز اعلانی ارسال نشده.";
      modal.classList.add("open");
    } catch (e) {
      showAdminToast(e.message, true);
    }
  }

  document.getElementById("statusFilter").addEventListener("change", renderTable);
  document.getElementById("searchBox").addEventListener("input", renderTable);
  document.getElementById("closeOrderModalBtn").addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

  document.getElementById("updateStatusBtn").addEventListener("click", async () => {
    const status = document.getElementById("om_status").value;
    try {
      await adminApi(`/orders/${activeOrderId}/status`, { method: "PUT", body: { status } });
      showAdminToast("وضعیت سفارش به‌روزرسانی شد ✓");
      modal.classList.remove("open");
      await loadAll();
      refreshAdminBadges();
    } catch (e) {
      showAdminToast(e.message, true);
    }
  });

  await loadAll();
})();
</script>
</body>
</html>
