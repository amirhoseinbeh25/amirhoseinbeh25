<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخواست‌های مرجوعی | پنل ادمین دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="admin-topbar"></div>
    <div class="content">

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>شماره سفارش</th><th>مشتری</th><th>تماس</th><th>مبلغ سفارش</th><th>دلیل مرجوعی</th><th>وضعیت</th><th>تاریخ</th></tr>
            </thead>
            <tbody id="returnsBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script>
(async () => {
  renderAdminShell("returns", "درخواست‌های مرجوعی");

  async function loadAll() {
    const rows = await adminApi("/returns");
    document.getElementById("returnsBody").innerHTML = rows.length
      ? rows.map(r => `
        <tr>
          <td>#${r.order_id}</td>
          <td>${r.customer_name}</td>
          <td>${r.phone}</td>
          <td>${formatPrice(r.total)}</td>
          <td style="max-width:240px; white-space:normal;">${r.reason}</td>
          <td>
            <select data-id="${r.id}" class="statusSelect">
              <option value="pending" ${r.status === "pending" ? "selected" : ""}>در انتظار بررسی</option>
              <option value="approved" ${r.status === "approved" ? "selected" : ""}>تاییدشده</option>
              <option value="rejected" ${r.status === "rejected" ? "selected" : ""}>ردشده</option>
            </select>
          </td>
          <td>${r.created_at}</td>
        </tr>`).join("")
      : `<tr class="empty-row"><td colspan="7">درخواست مرجوعی ثبت نشده است.</td></tr>`;

    document.querySelectorAll(".statusSelect").forEach(sel => {
      sel.addEventListener("change", async () => {
        try {
          await adminApi(`/returns/${sel.dataset.id}/status`, { method: "PUT", body: { status: sel.value } });
          showAdminToast("وضعیت به‌روزرسانی شد ✓");
        } catch (e) { showAdminToast(e.message, true); }
      });
    });
  }

  await loadAll();
})();
</script>
</body>
</html>
