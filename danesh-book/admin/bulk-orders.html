<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>سفارش‌های عمده | پنل ادمین دانش بوک</title>
<link rel="preload" href="../assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/admin.css?v=0b03412c">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="admin-topbar"></div>
    <div class="content">

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>مدرسه / مرکز</th><th>مسئول پیگیری</th><th>تماس</th><th>پایه</th><th>توضیحات</th><th>وضعیت</th><th>تاریخ</th></tr>
            </thead>
            <tbody id="bulkBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/data.js?v=01b60733"></script>
<script src="../js/api.js?v=c165e67f"></script>
<script src="js/admin-auth.js?v=aa1a6307"></script>
<script>
(async () => {
  renderAdminShell("bulk-orders", "سفارش‌های عمده مدارس");

  const STATUS_LABELS = { new: "جدید", contacted: "در حال پیگیری", closed: "بسته‌شده" };

  async function loadAll() {
    const rows = await adminApi("/bulk-orders");
    document.getElementById("bulkBody").innerHTML = rows.length
      ? rows.map(r => `
        <tr>
          <td>${esc(r.school_name)}</td>
          <td>${esc(r.contact_name)}</td>
          <td><a href="${esc(telHref(r.phone))}">${esc(r.phone)}</a></td>
          <td>${r.grade ? getGradeTitle(r.grade) : "—"}</td>
          <td style="max-width:220px; white-space:normal;">${esc(r.items_note || "—")}</td>
          <td>
            <select data-id="${r.id}" class="statusSelect">
              <option value="new" ${r.status === "new" ? "selected" : ""}>جدید</option>
              <option value="contacted" ${r.status === "contacted" ? "selected" : ""}>در حال پیگیری</option>
              <option value="closed" ${r.status === "closed" ? "selected" : ""}>بسته‌شده</option>
            </select>
          </td>
          <td style="white-space:nowrap;">${esc(r.created_at)}</td>
        </tr>`).join("")
      : `<tr class="empty-row"><td colspan="7">درخواستی ثبت نشده است.</td></tr>`;

    document.querySelectorAll(".statusSelect").forEach(sel => {
      sel.addEventListener("change", async () => {
        try {
          await adminApi(`/bulk-orders/${sel.dataset.id}/status`, { method: "PUT", body: { status: sel.value } });
          showAdminToast("وضعیت به‌روزرسانی شد ✓");
          refreshAdminBadges();
        } catch (e) { showAdminToast(e.message, true); }
      });
    });
  }

  await loadAll();
})();
</script>
</body>
</html>
