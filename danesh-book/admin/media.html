<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>کتابخانه تصاویر | پنل ادمین دانش بوک</title>
<link rel="preload" href="../assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/admin.css?v=0b03412c">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="admin-topbar"></div>
    <div class="content">

      <div class="panel">
        <div class="toolbar">
          <span class="muted" id="mediaInfo">همه تصاویری که در سایت آپلود کرده‌اید.</span>
          <div class="toolbar-group">
            <select id="filterBox">
              <option value="">همه تصاویر</option>
              <option value="unused">فقط تصاویر استفاده‌نشده</option>
            </select>
            <label class="btn btn-primary">📤 آپلود تصویر<input type="file" id="uploadInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden></label>
          </div>
        </div>
        <div class="media-library-grid" id="mediaGrid"></div>
        <small class="field-hint">تصاویری که در هیچ بخشی از سایت استفاده نمی‌شوند را می‌توانید برای آزاد شدن فضای هاست حذف کنید.</small>
      </div>

    </div>
  </div>
</div>

<script src="../js/data.js?v=01b60733"></script>
<script src="../js/api.js?v=c165e67f"></script>
<script src="js/admin-auth.js?v=aa1a6307"></script>
<script src="js/admin-ui.js?v=81739b02"></script>
<script>
(async () => {
  renderAdminShell("media", "کتابخانه تصاویر");
  let files = [];

  function sizeLabel(bytes) {
    return bytes > 1024 * 1024 ? (bytes / 1024 / 1024).toFixed(1) + " MB" : Math.round(bytes / 1024) + " KB";
  }

  function render() {
    const onlyUnused = document.getElementById("filterBox").value === "unused";
    const list = files.filter(f => !onlyUnused || !f.inUse);
    const total = files.reduce((s, f) => s + f.size, 0);
    document.getElementById("mediaInfo").textContent = `${files.length.toLocaleString("fa-IR")} تصویر — حجم کل: ${sizeLabel(total)}`;
    document.getElementById("mediaGrid").innerHTML = list.length
      ? list.map(f => `
        <div class="media-card">
          <a href="${esc(f.url)}" target="_blank" rel="noopener">${imgTag(f.url)}</a>
          <div class="media-meta">
            <span>${sizeLabel(f.size)} · ${f.inUse ? "✅ در حال استفاده" : "⚪️ استفاده‌نشده"}</span>
            <span>
              <button class="icon-btn" data-copy="${esc(f.url)}" title="کپی آدرس">📋</button>
              <button class="icon-btn" data-delete="${esc(f.name)}" data-inuse="${f.inUse ? 1 : 0}" title="حذف">🗑️</button>
            </span>
          </div>
        </div>`).join("")
      : `<div class="muted">تصویری وجود ندارد.</div>`;

    document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(b.dataset.copy);
        showAdminToast("آدرس تصویر کپی شد ✓");
      } catch (e) { showAdminToast(b.dataset.copy); }
    }));
    document.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", async () => {
      const inUse = b.dataset.inuse === "1";
      const msg = inUse
        ? "⚠️ این تصویر هنوز در سایت استفاده می‌شود و با حذف آن، جای خالی تصویر نمایش داده خواهد شد. مطمئن هستید؟"
        : "این تصویر حذف شود؟";
      if (!confirm(msg)) return;
      try {
        await adminApi("/uploads/" + encodeURIComponent(b.dataset.delete) + (inUse ? "?force=1" : ""), { method: "DELETE" });
        showAdminToast("تصویر حذف شد ✓");
        await load();
      } catch (e) { showAdminToast(e.message, true); }
    }));
  }

  async function load() {
    files = await adminApi("/uploads");
    render();
  }

  document.getElementById("filterBox").addEventListener("change", render);
  document.getElementById("uploadInput").addEventListener("change", async (e) => {
    const list = Array.from(e.target.files);
    for (const f of list) {
      try { await uploadImage(f); } catch (err) { showAdminToast(err.message, true); }
    }
    if (list.length) showAdminToast("آپلود انجام شد ✓");
    e.target.value = "";
    await load();
  });

  try { await load(); } catch (e) { showAdminToast(e.message, true); }
})();
</script>
</body>
</html>
