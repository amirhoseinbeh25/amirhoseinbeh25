<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>پک‌های آموزشی | پنل ادمین دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="admin-topbar"></div>
    <div class="content">

      <div class="panel">
        <div class="toolbar">
          <span style="color:var(--color-text-light); font-size:13.5px;">چند کتاب را در قالب یک پک آموزشی با تخفیف ویژه عرضه کنید.</span>
          <button class="btn btn-primary" id="addBundleBtn">➕ افزودن پک جدید</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>عنوان پک</th><th>تعداد کتاب</th><th>قیمت</th><th>وضعیت</th><th>عملیات</th></tr></thead>
            <tbody id="bundlesBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="bundleModal">
  <div class="modal-box modal-wide">
    <div class="modal-head">
      <h2 id="modalTitle">افزودن پک جدید</h2>
      <button type="button" class="icon-btn" id="closeModalBtn" aria-label="بستن">✕</button>
    </div>
    <form id="bundleForm">
      <input type="hidden" id="bundleId">
      <div class="form-grid">
        <div class="full">
          <label>تصویر پک (اختیاری — اگر خالی باشد از رنگ پک استفاده می‌شود)</label>
          <div id="imageField" class="wide"></div>
        </div>
        <div class="full">
          <label>عنوان پک *</label>
          <input type="text" id="f_title" required>
        </div>
        <div class="full">
          <label>توضیحات</label>
          <textarea id="f_description"></textarea>
        </div>
        <div>
          <label>قیمت پک (تومان) *</label>
          <input type="number" id="f_price" required min="0">
        </div>
        <div>
          <label>قیمت قبل از تخفیف</label>
          <input type="number" id="f_oldPrice" min="0">
        </div>
        <div>
          <label>رنگ (وقتی تصویر ندارد)</label>
          <input type="color" id="f_color" value="#2c5f8a">
        </div>
        <div>
          <label>وضعیت</label>
          <select id="f_active">
            <option value="1">فعال</option>
            <option value="0">غیرفعال</option>
          </select>
        </div>
        <div class="full">
          <label>کتاب‌های این پک *</label>
          <input type="search" id="checklistSearch" class="form-control" placeholder="جست‌وجوی کتاب..." style="margin-bottom:8px;">
          <div id="productChecklist" style="max-height:240px; overflow-y:auto; border:1px solid var(--color-border); border-radius:8px; padding:10px; background:rgba(255,255,255,.6);"></div>
          <small class="field-hint" id="checklistSum"></small>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">انصراف</button>
        <button type="submit" class="btn btn-primary">ذخیره پک</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-ui.js"></script>
<script>
(async () => {
  renderAdminShell("bundles", "پک‌های آموزشی");

  let bundles = [];
  let products = [];
  const modalEl = document.getElementById("bundleModal");
  const modalCtl = setupModal(modalEl);
  let editingId = null;
  const imageField = createImageField(document.getElementById("imageField"), {
    hint: "عکس عریض (مثلاً ۸۰۰ × ۴۰۰ پیکسل) از کتاب‌های این پک.", resize: { maxWidth: 1400, maxHeight: 900 }
  });

  function renderTable() {
    document.getElementById("bundlesBody").innerHTML = bundles.length
      ? bundles.map(b => `
        <tr class="${b.active ? "" : "inactive"}">
          <td>
            <div class="row-flex">
              ${safeImageUrl(b.imageUrl) ? `<img class="row-thumb" src="${esc(b.imageUrl)}" alt="">` : `<span class="row-thumb" style="display:inline-flex; align-items:center; justify-content:center; background:${esc(hexToRgba(b.color, 1))}; color:#fff;">🎁</span>`}
              <span>${esc(b.title)}</span>
            </div>
          </td>
          <td>${b.items.length} کتاب</td>
          <td>${formatPrice(b.price)}</td>
          <td><span class="badge ${b.active ? "stock-ok" : "stock-low"}">${b.active ? "فعال" : "غیرفعال"}</span></td>
          <td>
            <button class="icon-btn" data-act="edit" data-id="${b.id}" title="ویرایش">✏️</button>
            <button class="icon-btn" data-act="delete" data-id="${b.id}" title="حذف">🗑️</button>
          </td>
        </tr>`).join("")
      : `<tr class="empty-row"><td colspan="5">پکی ثبت نشده است.</td></tr>`;

    document.querySelectorAll('[data-act="edit"]').forEach(b => b.addEventListener("click", () => openModal(Number(b.dataset.id))));
    document.querySelectorAll('[data-act="delete"]').forEach(b => b.addEventListener("click", () => deleteBundle(Number(b.dataset.id))));
  }

  async function loadAll() {
    [bundles, products] = await Promise.all([adminApi("/bundles/admin/all"), fetchProducts()]);
    renderTable();
  }

  function openModal(id) {
    editingId = id || null;
    const b = id ? bundles.find(x => x.id === id) : null;
    document.getElementById("modalTitle").textContent = b ? "ویرایش پک" : "افزودن پک جدید";
    document.getElementById("f_title").value = b ? b.title : "";
    document.getElementById("f_description").value = b ? (b.description || "") : "";
    document.getElementById("f_price").value = b ? b.price : "";
    document.getElementById("f_oldPrice").value = b && b.oldPrice ? b.oldPrice : "";
    document.getElementById("f_color").value = b ? b.color : "#2c5f8a";
    document.getElementById("f_active").value = b ? (b.active ? "1" : "0") : "1";

    const selectedIds = b ? b.items.map(it => it.id) : [];
    document.getElementById("productChecklist").innerHTML = products.map(p => `
      <label class="check-row" data-title="${esc(p.title.toLowerCase())}" style="padding:6px 0;">
        <input type="checkbox" value="${Number(p.id)}" data-price="${Number(p.price)}" ${selectedIds.includes(p.id) ? "checked" : ""}>
        ${esc(p.title)} — ${formatPrice(p.price)}
      </label>`).join("");
    document.getElementById("checklistSearch").value = "";
    imageField.set(b ? b.imageUrl || "" : "");
    updateChecklistSum();
    modalCtl.open();
  }
  function closeModal() { modalCtl.close(); }

  // جمع قیمت کتاب‌های انتخاب‌شده برای کمک به تعیین قیمت پک
  function updateChecklistSum() {
    const checked = Array.from(document.querySelectorAll("#productChecklist input:checked"));
    const sum = checked.reduce((s, i) => s + Number(i.dataset.price), 0);
    document.getElementById("checklistSum").textContent = checked.length
      ? `${checked.length.toLocaleString("fa-IR")} کتاب انتخاب شده — جمع قیمت تکی: ${formatPrice(sum)}`
      : "هنوز کتابی انتخاب نشده است.";
  }
  document.getElementById("productChecklist").addEventListener("change", updateChecklistSum);
  document.getElementById("checklistSearch").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#productChecklist label").forEach(l => { l.hidden = q && !l.dataset.title.includes(q); });
  });

  async function deleteBundle(id) {
    const b = bundles.find(x => x.id === id);
    if (!confirm(`آیا از حذف پک «${b.title}» مطمئن هستید؟`)) return;
    try {
      await adminApi("/bundles/" + id, { method: "DELETE" });
      showAdminToast("پک حذف شد ✓");
      await loadAll();
    } catch (e) { showAdminToast(e.message, true); }
  }

  document.getElementById("addBundleBtn").addEventListener("click", () => openModal(null));
  document.getElementById("cancelModalBtn").addEventListener("click", closeModal);
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);

  document.getElementById("bundleForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const productIds = Array.from(document.querySelectorAll('#productChecklist input:checked')).map(i => Number(i.value));
    if (!productIds.length) { showAdminToast("حداقل یک کتاب برای پک انتخاب کنید", true); return; }

    const payload = {
      title: document.getElementById("f_title").value.trim(),
      description: document.getElementById("f_description").value.trim(),
      price: Number(document.getElementById("f_price").value),
      oldPrice: document.getElementById("f_oldPrice").value ? Number(document.getElementById("f_oldPrice").value) : null,
      color: document.getElementById("f_color").value,
      imageUrl: imageField.get() || null,
      active: document.getElementById("f_active").value === "1",
      productIds
    };

    try {
      if (editingId) {
        await adminApi("/bundles/" + editingId, { method: "PUT", body: payload });
        showAdminToast("پک به‌روزرسانی شد ✓");
      } else {
        await adminApi("/bundles", { method: "POST", body: payload });
        showAdminToast("پک جدید اضافه شد ✓");
      }
      closeModal();
      await loadAll();
    } catch (e) { showAdminToast(e.message, true); }
  });

  await loadAll();
})();
</script>
</body>
</html>
