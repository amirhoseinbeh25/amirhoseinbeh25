<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفارش عمده برای مدارس | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / سفارش عمده برای مدارس</div>
  <h1>🏫 سفارش عمده و سازمانی</h1>
  <p style="max-width:700px; color:var(--color-text-light);">
    مدارس، آموزشگاه‌ها و کتاب‌فروشی‌ها می‌توانند برای خرید عمده کتاب‌های کمک درسی با تخفیف ویژه، فرم زیر را تکمیل کنند
    تا همکاران ما در اسرع وقت با شما تماس بگیرند.
  </p>

  <form class="contact-form" id="bulkForm" style="max-width:600px; margin-top:20px;">
    <input type="text" id="schoolName" required placeholder="نام مدرسه / آموزشگاه / کتاب‌فروشی">
    <input type="text" id="contactName" required placeholder="نام مسئول پیگیری">
    <input type="tel" id="phone" required placeholder="شماره تماس">
    <select id="grade" style="padding:12px 14px; border-radius:8px; border:1px solid var(--color-border); font-family:inherit; background:rgba(255,255,255,.8);">
      <option value="">پایه تحصیلی (اختیاری)</option>
    </select>
    <textarea id="itemsNote" placeholder="عناوین و تعداد نسخه مورد نیاز را بنویسید..."></textarea>
    <button type="submit" class="btn btn-primary">ارسال درخواست</button>
  </form>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  try { CATEGORIES = await fetchCategories(); } catch (e) { /* قابل چشم‌پوشی */ }
  renderLayout();

  document.getElementById("grade").innerHTML += GRADES.map(g => `<option value="${g.id}">${g.title}</option>`).join("");

  document.getElementById("bulkForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "در حال ارسال...";
    try {
      await submitBulkOrder({
        schoolName: document.getElementById("schoolName").value.trim(),
        contactName: document.getElementById("contactName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        grade: document.getElementById("grade").value,
        itemsNote: document.getElementById("itemsNote").value.trim()
      });
      e.target.innerHTML = `<div class="empty-state"><div class="ico">✅</div><p>درخواست شما ثبت شد؛ همکاران ما به‌زودی تماس می‌گیرند.</p></div>`;
    } catch (err) {
      showToast(err.message, true);
      btn.disabled = false; btn.textContent = "ارسال درخواست";
    }
  });
})();
</script>
</body>
</html>
