<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>دانش بوک | فروشگاه کتاب‌های کمک درسی و کنکور</title>
<meta name="description" content="دانش بوک، فروشگاه اینترنتی تخصصی کتاب‌های کمک درسی و کنکور؛ خرید آنلاین کتاب‌های ریاضی، فیزیک، شیمی، زیست، ادبیات، زبان و عربی برای تمام پایه‌ها با ارسال سریع به سراسر ایران.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main id="homeRoot">
  <div class="container"><div class="page-loading">در حال بارگذاری...</div></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  await initPage("index");

  const root = document.getElementById("homeRoot");
  const sections = (HOME.sections || []).filter(s => s.enabled);
  const has = (key) => sections.some(s => s.key === key);

  if (setting("site_name")) {
    document.title = `${setting("site_name")} | فروشگاه کتاب‌های کمک درسی و کنکور`;
  }
  if (setting("seo_description")) {
    document.querySelector('meta[name="description"]').setAttribute("content", setting("seo_description"));
  }

  let slides = [], bundles = [], posts = [];
  try {
    [BOOKS, slides, bundles, posts] = await Promise.all([
      fetchProducts(),
      has("slider") ? fetchSlides().catch(() => []) : [],
      has("bundles") ? fetchBundles().catch(() => []) : [],
      has("blog") ? fetchPosts().catch(() => []) : []
    ]);
  } catch (e) {
    root.innerHTML = `<div class="container"><div class="empty-state"><div class="ico">⚠️</div><p>${esc(e.message)}</p></div></div>`;
    return;
  }

  const sectionTitle = (s, link) => `
    <div class="section-title">
      <div>
        <h2>${esc(s.title || "")}</h2>
        ${s.subtitle ? `<p>${esc(s.subtitle)}</p>` : ""}
      </div>
      ${link ? `<a href="${link}">مشاهده همه ←</a>` : ""}
    </div>`;

  const bestSellers = () => {
    const list = BOOKS.filter(b => b.badge === "پرفروش");
    return (list.length ? list : BOOKS);
  };
  const newArrivals = () => {
    const seen = new Set();
    return BOOKS.filter(b => b.badge === "جدید").concat(BOOKS).filter(b => !seen.has(b.id) && seen.add(b.id));
  };

  // هر بخش: html و (در صورت نیاز) کاری که بعد از قرار گرفتن در صفحه انجام می‌شود
  const RENDERERS = {
    slider: () => slides.length ? { html: `<div class="container">${heroSliderHTML(slides)}</div>`, after: initHeroSlider } : null,

    konkur_countdown: (s) => setting("konkur_exam_date") ? {
      html: `
        <div class="container">
          <div class="flash-sale konkur-box">
            <div><h3>${esc(s.title)}</h3>${s.subtitle ? `<p>${esc(s.subtitle)}</p>` : ""}</div>
            <div class="countdown" id="konkurCountdown"></div>
          </div>
        </div>`,
      after: () => startExamCountdown("konkurCountdown", setting("konkur_exam_date"))
    } : null,

    categories: (s) => CATEGORIES.length ? {
      block: true,
      html: `${sectionTitle(s)}
        <div class="cat-grid">
          ${CATEGORIES.map(c => {
            const img = safeImageUrl(c.imageUrl);
            return `
            <a class="cat-card ${img ? "has-image" : ""}" href="shop.html?cat=${encodeURIComponent(c.id)}">
              ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : `<div class="ico">${esc(c.icon || "📚")}</div>`}
              <div class="ttl">${esc(c.title)}</div>
              ${c.productCount ? `<div class="cnt">${Number(c.productCount).toLocaleString("fa-IR")} کتاب</div>` : ""}
            </a>`;
          }).join("")}
        </div>`
    } : null,

    bestsellers: (s) => ({
      block: true,
      html: `${sectionTitle(s, "shop.html")}<div class="product-grid" id="bestSellers"></div>`,
      after: () => renderProductGrid("bestSellers", bestSellers().slice(0, s.limit || 4))
    }),

    flash: (s) => {
      const list = BOOKS.filter(b => b.oldPrice).slice(0, s.limit || 4);
      if (!list.length) return null;
      return {
        block: true,
        html: `
          <div class="flash-sale">
            <div><h3>${esc(s.title)}</h3>${s.subtitle ? `<p>${esc(s.subtitle)}</p>` : ""}</div>
            <div class="countdown" id="flashCountdown"></div>
          </div>
          <div class="product-grid" id="flashProducts"></div>`,
        after: () => {
          renderProductGrid("flashProducts", list);
          startCountdown("flashCountdown", Number(setting("flash_hours", 8)) || 8);
        }
      };
    },

    new_arrivals: (s) => ({
      block: true,
      html: `${sectionTitle(s, "shop.html?sort=newest")}<div class="product-grid" id="newArrivals"></div>`,
      after: () => renderProductGrid("newArrivals", newArrivals().slice(0, s.limit || 4))
    }),

    bundles: (s) => bundles.length ? {
      block: true,
      html: `${sectionTitle(s, "bundles.html")}<div class="bundle-grid" id="bundleGrid"></div>`,
      after: () => renderBundleGrid("bundleGrid", bundles.slice(0, s.limit || 2))
    } : null,

    blog: (s) => posts.length ? {
      block: true,
      html: `${sectionTitle(s, "blog.html")}<div class="post-grid">${posts.slice(0, s.limit || 3).map(postCardHTML).join("")}</div>`
    } : null,

    banners: () => {
      const banners = (HOME.banners || []).filter(b => safeImageUrl(b.image));
      if (!banners.length) return null;
      return {
        html: `
          <div class="container">
            <div class="promo-banners count-${Math.min(banners.length, 3)}">
              ${banners.map(b => {
                const img = `<img src="${esc(safeImageUrl(b.image))}" alt="${esc(b.alt || "")}" loading="lazy">`;
                return b.link ? `<a class="promo-banner" href="${esc(safeUrl(b.link))}">${img}</a>` : `<div class="promo-banner">${img}</div>`;
              }).join("")}
            </div>
          </div>`
      };
    },

    trust: () => {
      const items = HOME.trustItems || [];
      if (!items.length) return null;
      const bg = safeImageUrl(setting("trust_bg_image"));
      return {
        html: `
          <section class="block alt has-photo-bg">
            ${bg ? `<div class="photo-layer" style="background-image:${esc(cssUrl(bg))}; --overlay: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.7));"></div>` : ""}
            <div class="container">
              <div class="glass-panel">
                <div class="trust-grid">
                  ${items.map(it => `<div class="trust-item"><div class="ico">${esc(it.icon)}</div><b>${esc(it.title)}</b><span>${esc(it.text)}</span></div>`).join("")}
                </div>
              </div>
            </div>
          </section>`
      };
    },

    newsletter: () => {
      const bg = safeImageUrl(setting("newsletter_bg_image"));
      return {
        html: `
          <section class="block has-photo-bg">
            ${bg ? `<div class="photo-layer" style="background-image:${esc(cssUrl(bg))}; --overlay: linear-gradient(135deg, rgba(var(--rgb-primary),.5), rgba(var(--rgb-accent),.5));"></div>` : ""}
            <div class="container">
              <div class="newsletter">
                <h3>${esc(setting("newsletter_title", "📬 عضویت در خبرنامه"))}</h3>
                <p>${esc(setting("newsletter_text"))}</p>
                <form id="newsletterForm">
                  <input type="email" required placeholder="آدرس ایمیل شما" aria-label="ایمیل">
                  <button type="submit">${esc(setting("newsletter_button", "عضویت"))}</button>
                </form>
              </div>
            </div>
          </section>`,
        after: () => initNewsletterForm("newsletterForm")
      };
    }
  };

  const rendered = [];
  let blockIndex = 0;
  for (const s of sections) {
    const r = RENDERERS[s.key] && RENDERERS[s.key](s);
    if (!r) continue;
    // بخش‌های معمولی یک‌درمیان پس‌زمینه شیشه‌ای می‌گیرند
    const html = r.block
      ? `<section class="block ${blockIndex++ % 2 ? "alt" : ""}"><div class="container">${r.html}</div></section>`
      : r.html;
    rendered.push({ html, after: r.after });
  }

  root.innerHTML = rendered.length
    ? rendered.map(r => r.html).join("")
    : `<div class="container"><div class="empty-state"><div class="ico">🏗</div><p>هیچ بخشی برای صفحه اصلی فعال نیست.</p></div></div>`;
  rendered.forEach(r => r.after && r.after());
})();
</script>
</body>
</html>
