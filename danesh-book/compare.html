<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>مقایسه کتاب‌ها | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / مقایسه کتاب‌ها</div>
  <h1 style="margin:0 0 18px;">⇄ مقایسه کتاب‌های کمک درسی</h1>
  <div id="compareRoot" class="compare-wrap"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  await initPage("compare");

  const root = document.getElementById("compareRoot");

  async function render() {
    const ids = getCompareList();
    if (!ids.length) {
      root.innerHTML = `<div class="empty-state"><div class="ico">⇄</div><p>هنوز کتابی برای مقایسه انتخاب نکرده‌اید.</p><a href="shop.html" class="btn btn-primary">مشاهده فروشگاه</a></div>`;
      return;
    }
    root.innerHTML = `<p>در حال بارگذاری...</p>`;
    const books = (await Promise.all(ids.map(id => fetchProduct(id).catch(() => null)))).filter(Boolean);
    if (books.length !== ids.length) saveCompareList(books.map(b => b.id));
    if (!books.length) return render();

    const rows = [
      ["جلد", b => `<a href="product.html?id=${Number(b.id)}"><img src="${esc(productImage(b))}" alt="${esc(b.title)}"></a>`],
      ["عنوان", b => `<a href="product.html?id=${Number(b.id)}"><b>${esc(b.title)}</b></a>`],
      ["درس", b => esc(getCategoryTitle(b.category))],
      ["پایه", b => b.grade ? esc(getGradeTitle(b.grade)) : "—"],
      ["رشته", b => b.track ? esc(getTrackTitle(b.track)) : "—"],
      ["ناشر", b => esc(b.publisher || "—")],
      ["چاپ", b => esc(b.year || "—")],
      ["تعداد صفحات", b => esc(b.pages || "—")],
      ["امتیاز", b => `${Number(b.rating) || 0} ★ (${Number(b.reviews) || 0} نظر)`],
      ["قیمت", b => formatPrice(b.price)],
      ["موجودی", b => b.stock > 0 ? `${Number(b.stock)} عدد` : "ناموجود"],
      ["", b => `
        ${b.stock > 0 ? `<button class="btn btn-primary btn-sm" onclick="addToCart(${Number(b.id)})">افزودن به سبد</button>` : ""}
        <button class="btn btn-outline btn-sm" data-remove="${Number(b.id)}">حذف از مقایسه</button>`]
    ];

    root.innerHTML = `
      <table class="compare-table">
        ${rows.map(([label, fn]) => `
          <tr><th>${label}</th>${books.map(b => `<td>${fn(b)}</td>`).join("")}</tr>
        `).join("")}
      </table>`;
    root.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => {
      toggleCompare(Number(btn.dataset.remove));
      render();
    }));
  }

  await render();
})();
</script>
</body>
</html>
