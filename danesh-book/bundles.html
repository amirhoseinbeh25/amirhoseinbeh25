  <h1 class="page-title">🎁 پک‌های آموزشی ویژه</h1>

<script>
(async () => {
  const bundlesPromise = fetchBundles();
  await initPage("bundles");
  try {
    renderBundleGrid("bundleGrid", await bundlesPromise);
  } catch (e) {
    document.getElementById("bundleGrid").innerHTML = `<div class="empty-state"><div class="ico">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
