<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>ورود به حساب کاربری | دانش بوک</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=ed8bbddf">
</head>
<body>

<div id="site-header"></div>

<main class="container auth-wrap">
  <div class="auth-card">
    <h1>👤 ورود به حساب کاربری</h1>
    <p class="sub">برای مشاهده سفارش‌ها و امتیازهای خود وارد شوید</p>
    <div class="auth-error" id="errorMsg"></div>
    <form id="loginForm">
      <label>شماره موبایل</label>
      <input type="tel" id="phone" required placeholder="09xxxxxxxxx">
      <label>رمز عبور</label>
      <input type="password" id="password" required placeholder="••••••••">
      <button type="submit" class="btn btn-primary" style="margin-top:6px;">ورود</button>
    </form>
    <div class="switch-link">حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js?v=01b60733"></script>
<script src="js/api.js?v=c165e67f"></script>
<script src="js/app.js?v=4a2e24d2"></script>
<script src="js/layout.js?v=490623c1"></script>
<script>
(async () => {
  await initPage("login");

  if (getCustomerToken()) window.location.href = "account.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("errorMsg");
    errorBox.style.display = "none";
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "در حال ورود...";
    try {
      const data = await loginCustomer({
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value
      });
      setCustomerSession(data.token, data.user);
      window.location.href = "account.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "ورود";
    }
  });
})();
</script>
</body>
</html>
