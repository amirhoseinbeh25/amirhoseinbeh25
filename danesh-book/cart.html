<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>سبد خرید | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / سبد خرید</div>
  <h1 style="margin:0 0 20px;">🛒 سبد خرید</h1>
  <div id="cartRoot"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  await initPage("cart");

  let itemsData = {};

  function keyOf(item) { return `${item.type || "product"}-${item.id}`; }

  async function loadItemsData() {
    const cart = getCart();
    itemsData = {};
    await Promise.all(cart.map(async item => {
      try {
        const data = item.type === "bundle" ? await fetchBundle(item.id) : await fetchProduct(item.id);
        itemsData[keyOf(item)] = data;
      } catch (e) { /* حذف‌شده از فروشگاه */ }
    }));
  }

  function coverHTML(item, data) {
    if (item.type === "bundle") {
      const img = safeImageUrl(data.imageUrl);
      return img
        ? `<img src="${esc(img)}" alt="${esc(data.title)}">`
        : `<div class="cart-thumb" style="background:linear-gradient(135deg, ${esc(hexToRgba(data.color, 1))}, #16222b);">🎁</div>`;
    }
    return `<img src="${esc(productImage(data))}" alt="${esc(data.title)}">`;
  }

  async function renderCart() {
    const cart = getCart();
    const root = document.getElementById("cartRoot");

    if (!cart.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="ico">🛒</div>
          <p>سبد خرید شما خالی است.</p>
          <a href="shop.html" class="btn btn-primary">مشاهده کتاب‌ها</a>
        </div>`;
      return;
    }

    root.innerHTML = `<div class="empty-state"><p>در حال بارگذاری سبد خرید...</p></div>`;
    await loadItemsData();

    // کالاهایی که دیگر در فروشگاه نیستند از سبد حذف می‌شوند
    const validCart = cart.filter(item => itemsData[keyOf(item)]);
    if (validCart.length !== cart.length) {
      saveCart(validCart);
      showToast("برخی کالاها دیگر موجود نبودند و از سبد حذف شدند", true);
      if (!validCart.length) return renderCart();
    }

    const rows = validCart.map(item => {
      const data = itemsData[keyOf(item)];
      const type = item.type === "bundle" ? "bundle" : "product";
      const lineTotal = data.price * item.qty;
      const link = type === "bundle" ? "bundles.html" : `product.html?id=${Number(data.id)}`;
      const id = Number(item.id);
      return `
        <tr>
          <td class="cart-cell-item">
            <div class="cart-item-info">
              ${coverHTML(item, data)}
              <div>
                <a href="${link}"><b>${esc(data.title)}</b></a><br>
                <small style="color:var(--color-text-light)">${type === "bundle" ? "پک آموزشی" : esc(data.author)}</small>
              </div>
            </div>
          </td>
          <td data-label="قیمت واحد">${formatPrice(data.price)}</td>
          <td data-label="تعداد">
            <div class="qty-control" style="margin:0 auto;">
              <button data-act="inc" data-id="${id}" data-type="${type}" data-qty="${Number(item.qty)}" aria-label="افزایش">+</button>
              <span>${Number(item.qty)}</span>
              <button data-act="dec" data-id="${id}" data-type="${type}" data-qty="${Number(item.qty)}" aria-label="کاهش">−</button>
            </div>
          </td>
          <td data-label="جمع"><b>${formatPrice(lineTotal)}</b></td>
          <td class="cart-cell-remove"><button class="cart-remove" data-act="remove" data-id="${id}" data-type="${type}" title="حذف" aria-label="حذف از سبد">🗑</button></td>
        </tr>`;
    }).join("");

    const subtotal = validCart.reduce((sum, item) => sum + itemsData[keyOf(item)].price * item.qty, 0);
    const shipping = shippingCost(subtotal);
    const total = subtotal + shipping;
    const freeThreshold = Number(setting("free_shipping_threshold", 0)) || 0;
    const remaining = freeThreshold - subtotal;
    const customer = getCustomerInfo();

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          <table class="cart-table">
            <thead>
              <tr><th>کالا</th><th>قیمت واحد</th><th>تعداد</th><th>جمع</th><th></th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <a href="shop.html" class="btn btn-outline" style="margin-top:16px;">→ ادامه خرید</a>
        </div>
        <div class="cart-summary">
          <h3>خلاصه سفارش</h3>
          <div class="row"><span>جمع کل کالاها</span><span>${formatPrice(subtotal)}</span></div>
          <div class="row"><span>هزینه ارسال</span><span>${shipping === 0 ? "رایگان" : formatPrice(shipping)}</span></div>
          <div class="row total"><span>مبلغ قابل پرداخت</span><span>${formatPrice(total)}</span></div>
          ${shipping > 0 && remaining > 0 ? `<div class="free-ship-hint">🚚 با ${formatPrice(remaining)} خرید بیشتر، ارسال رایگان می‌شود.</div>` : ""}

          <form id="checkoutForm" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="custName" required maxlength="80" placeholder="نام و نام خانوادگی" aria-label="نام و نام خانوادگی" value="${customer ? esc(customer.name) : ""}">
            <input type="tel" id="custPhone" required maxlength="20" placeholder="شماره تماس" aria-label="شماره تماس" value="${customer ? esc(customer.phone) : ""}">
            <input type="text" id="custAddress" maxlength="500" placeholder="آدرس (اختیاری)" aria-label="آدرس">
            <button type="submit" class="btn btn-primary btn-block">پرداخت و ثبت سفارش</button>
          </form>
        </div>
      </div>`;

    root.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = Number(btn.dataset.id);
        const type = btn.dataset.type;
        if (btn.dataset.act === "remove") removeFromCart(id, type);
        if (btn.dataset.act === "inc") setCartQty(id, Number(btn.dataset.qty) + 1, type);
        if (btn.dataset.act === "dec") setCartQty(id, Number(btn.dataset.qty) - 1, type);
        await renderCart();
      });
    });

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "در حال ثبت سفارش...";
      try {
        const order = await submitOrder({
          items: getCart(),
          customer: {
            name: document.getElementById("custName").value.trim(),
            phone: document.getElementById("custPhone").value.trim(),
            address: document.getElementById("custAddress").value.trim()
          }
        });
        saveCart([]);

        submitBtn.textContent = "در حال انتقال به درگاه پرداخت...";
        const pay = await requestPayment(order.id);
        window.location.href = pay.paymentUrl;
      } catch (err) {
        showToast(err.message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = "پرداخت و ثبت سفارش";
      }
    });
  }

  renderCart();
})();
</script>
</body>
</html>
