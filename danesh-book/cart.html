<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / سبد خرید</div>
  <h1 style="margin-bottom:20px;">🛒 سبد خرید</h1>
  <div id="cartRoot"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  try {
    CATEGORIES = await fetchCategories();
  } catch (e) { /* قابل چشم‌پوشی برای صفحه سبد خرید */ }
  renderLayout();

  function shippingCost(subtotal) {
    return subtotal === 0 || subtotal >= 500000 ? 0 : 35000;
  }

  let itemsData = {};

  function keyOf(item) { return `${item.type || "product"}-${item.id}`; }

  async function loadItemsData() {
    const cart = getCart();
    itemsData = {};
    await Promise.all(cart.map(async item => {
      try {
        const data = item.type === "bundle" ? await fetchBundle(item.id) : await fetchProduct(item.id);
        itemsData[keyOf(item)] = data;
      } catch (e) { /* حذف‌شده از فروشگاه */ }
    }));
  }

  function coverHTML(item, data) {
    if (item.type === "bundle") {
      return `<div style="width:56px; height:76px; border-radius:6px; background:linear-gradient(135deg, ${data.color}, #16222b); display:flex; align-items:center; justify-content:center; font-size:22px;">🎁</div>`;
    }
    return `<img src="${bookCoverDataUrl(data)}" alt="${data.title}">`;
  }

  async function renderCart() {
    const cart = getCart();
    const root = document.getElementById("cartRoot");

    if (!cart.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="ico">🛒</div>
          <p>سبد خرید شما خالی است.</p>
          <a href="shop.html" class="btn btn-primary">مشاهده کتاب‌ها</a>
        </div>`;
      return;
    }

    root.innerHTML = `<div class="empty-state"><p>در حال بارگذاری سبد خرید...</p></div>`;
    await loadItemsData();

    const rows = cart.map(item => {
      const data = itemsData[keyOf(item)];
      if (!data) return "";
      const lineTotal = data.price * item.qty;
      const link = item.type === "bundle" ? `bundles.html` : `product.html?id=${data.id}`;
      return `
        <tr>
          <td>
            <div class="cart-item-info">
              ${coverHTML(item, data)}
              <div>
                <a href="${link}"><b>${data.title}</b></a><br>
                <small style="color:var(--color-text-light)">${item.type === "bundle" ? "پک آموزشی" : data.author}</small>
              </div>
            </div>
          </td>
          <td>${formatPrice(data.price)}</td>
          <td>
            <div class="qty-control" style="margin:0 auto;">
              <button data-act="dec" data-id="${item.id}" data-type="${item.type || "product"}" data-qty="${item.qty}">−</button>
              <span>${item.qty}</span>
              <button data-act="inc" data-id="${item.id}" data-type="${item.type || "product"}" data-qty="${item.qty}">+</button>
            </div>
          </td>
          <td><b>${formatPrice(lineTotal)}</b></td>
          <td><button class="cart-remove" data-act="remove" data-id="${item.id}" data-type="${item.type || "product"}" title="حذف">🗑</button></td>
        </tr>`;
    }).join("");

    const subtotal = cart.reduce((sum, item) => {
      const data = itemsData[keyOf(item)];
      return sum + (data ? data.price * item.qty : 0);
    }, 0);
    const shipping = shippingCost(subtotal);
    const total = subtotal + shipping;
    const customer = getCustomerInfo();

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          <table class="cart-table">
            <thead>
              <tr><th>کالا</th><th>قیمت واحد</th><th>تعداد</th><th>جمع</th><th></th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <a href="shop.html" class="btn btn-outline" style="margin-top:16px;">← ادامه خرید</a>
        </div>
        <div class="cart-summary">
          <h3>خلاصه سفارش</h3>
          <div class="row"><span>جمع کل کالاها</span><span>${formatPrice(subtotal)}</span></div>
          <div class="row"><span>هزینه ارسال</span><span>${shipping === 0 ? "رایگان" : formatPrice(shipping)}</span></div>
          <div class="row total"><span>مبلغ قابل پرداخت</span><span>${formatPrice(total)}</span></div>

          <form id="checkoutForm" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="custName" required placeholder="نام و نام خانوادگی" value="${customer ? customer.name : ""}">
            <input type="tel" id="custPhone" required placeholder="شماره تماس" value="${customer ? customer.phone : ""}">
            <input type="text" id="custAddress" placeholder="آدرس (اختیاری)">
            <button type="submit" class="btn btn-primary btn-block">پرداخت و ثبت سفارش</button>
          </form>
        </div>
      </div>`;

    root.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = Number(btn.dataset.id);
        const type = btn.dataset.type;
        if (btn.dataset.act === "remove") removeFromCart(id, type);
        if (btn.dataset.act === "inc") setCartQty(id, Number(btn.dataset.qty) + 1, type);
        if (btn.dataset.act === "dec") setCartQty(id, Number(btn.dataset.qty) - 1, type);
        await renderCart();
      });
    });

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "در حال ثبت سفارش...";
      try {
        const order = await submitOrder({
          items: getCart(),
          customer: {
            name: document.getElementById("custName").value.trim(),
            phone: document.getElementById("custPhone").value.trim(),
            address: document.getElementById("custAddress").value.trim()
          }
        });
        saveCart([]);

        submitBtn.textContent = "در حال انتقال به درگاه پرداخت...";
        const pay = await requestPayment(order.id);
        window.location.href = pay.paymentUrl;
      } catch (err) {
        showToast(err.message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = "پرداخت و ثبت سفارش";
      }
    });
  }

  renderCart();
})();
</script>
</body>
</html>
