<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>حساب کاربری من | دانش بوک</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=ed8bbddf">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div class="breadcrumb"><a href="index.html">خانه</a> / حساب کاربری</div>
  <div id="accountRoot"></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js?v=01b60733"></script>
<script src="js/api.js?v=c165e67f"></script>
<script src="js/app.js?v=4a2e24d2"></script>
<script src="js/layout.js?v=490623c1"></script>
<script>
(async () => {
  const dataReq = getCustomerToken() ? Promise.all([fetchMyProfile(), fetchMyOrders()]) : null;
  if (dataReq) dataReq.catch(() => {});
  await initPage("account");

  if (!getCustomerToken()) { window.location.href = "login.html"; return; }

  const root = document.getElementById("accountRoot");
  const STATUS_LABELS = {
    pending: "در انتظار بررسی", processing: "در حال پردازش",
    shipped: "ارسال‌شده", delivered: "تحویل‌شده", cancelled: "لغو‌شده"
  };

  let profile, orders;
  try {
    [profile, orders] = await dataReq;
  } catch (e) {
    clearCustomerSession();
    window.location.href = "login.html";
    return;
  }

  function orderRowHTML(o) {
    const itemsHtml = o.items.map(it => `<li>${esc(it.title)} × ${Number(it.qty)}</li>`).join("");
    const canReturn = o.status === "delivered";
    return `
      <div class="panel" style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <b>سفارش #${o.id}</b>
            <span class="status-badge ${esc(o.status)}" style="margin-right:10px;">${STATUS_LABELS[o.status] || esc(o.status)}</span>
            ${o.payment_status === "paid" ? `<span class="status-badge delivered">پرداخت‌شده</span>` : `<span class="status-badge pending">پرداخت‌نشده</span>`}
          </div>
          <span style="color:var(--color-text-light); font-size:13px;">${esc(o.created_at)}</span>
        </div>
        <ul style="margin:10px 0; padding-right:18px; font-size:13.5px;">${itemsHtml}</ul>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
          <b>${formatPrice(o.total)}</b>
          ${canReturn ? `<button class="btn btn-outline btn-sm" onclick="toggleReturnForm(${o.id})">درخواست مرجوعی</button>` : ""}
        </div>
        <div id="returnForm-${o.id}" style="display:none; margin-top:12px;">
          <textarea class="form-control" id="returnReason-${o.id}" placeholder="دلیل درخواست مرجوعی را بنویسید..." style="min-height:70px;"></textarea>
          <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="submitReturn(${o.id})">ارسال درخواست</button>
        </div>
      </div>`;
  }

  root.innerHTML = `
    <div class="info-grid" style="margin-top:0;">
      <div class="info-card">
        <div style="font-size:28px;">👤</div>
        <h3>${esc(profile.name)}</h3>
        <p>${esc(profile.phone)}</p>
      </div>
      <div class="info-card">
        <div style="font-size:28px;">⭐</div>
        <h3>${Number(profile.points) || 0} امتیاز</h3>
        <p>باشگاه مشتریان دانش بوک</p>
      </div>
      <div class="info-card">
        <div style="font-size:28px;">🧾</div>
        <h3>${orders.length} سفارش</h3>
        <p>تاریخچه خرید شما</p>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:24px 0 14px;">
      <h2 style="margin:0;">سفارش‌های من</h2>
      <button class="btn btn-outline btn-sm" id="logoutBtn">خروج از حساب</button>
    </div>

    ${orders.length ? orders.map(orderRowHTML).join("") : `<div class="empty-state"><div class="ico">🧾</div><p>هنوز سفارشی ثبت نکرده‌اید.</p><a href="shop.html" class="btn btn-primary">مشاهده فروشگاه</a></div>`}
  `;

  document.getElementById("logoutBtn").addEventListener("click", () => {
    clearCustomerSession();
    window.location.href = "index.html";
  });

  window.toggleReturnForm = function (orderId) {
    const box = document.getElementById("returnForm-" + orderId);
    box.style.display = box.style.display === "none" ? "block" : "none";
  };

  window.submitReturn = async function (orderId) {
    const reason = document.getElementById("returnReason-" + orderId).value.trim();
    if (!reason) { showToast("لطفاً دلیل مرجوعی را بنویسید", true); return; }
    try {
      await submitReturnRequest(orderId, reason);
      showToast("درخواست مرجوعی شما ثبت شد ✓");
      document.getElementById("returnForm-" + orderId).style.display = "none";
    } catch (e) {
      showToast(e.message, true);
    }
  };
})();
</script>
</body>
</html>
