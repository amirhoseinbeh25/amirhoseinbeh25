<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>تماس با ما | دانش بوک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container page-content">
  <div id="pageRoot"><div class="page-loading">در حال بارگذاری...</div></div>

  <div class="info-grid" id="contactCards"></div>

  <h2>فرم ارتباط با ما</h2>
  <form class="contact-form" id="contactForm">
    <input type="text" id="cName" required maxlength="80" placeholder="نام و نام خانوادگی *" aria-label="نام">
    <div class="row-2">
      <input type="email" id="cEmail" maxlength="120" placeholder="ایمیل" aria-label="ایمیل">
      <input type="tel" id="cPhone" maxlength="20" placeholder="شماره تماس" aria-label="شماره تماس">
    </div>
    <input type="text" id="cSubject" maxlength="150" placeholder="موضوع" aria-label="موضوع">
    <textarea id="cMessage" required maxlength="3000" placeholder="پیام شما... *" aria-label="پیام"></textarea>
    <button type="submit" class="btn btn-primary">ارسال پیام</button>
  </form>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
(async () => {
  const page = fetchPage("contact").catch(() => null);
  await initPage("contact");
  await renderCmsPage("contact", "pageRoot", page);

  // اطلاعات تماس از تنظیمات سایت (پنل ادمین ← تنظیمات ← فوتر و تماس)
  const cards = [
    setting("contact_address") && { ico: "📍", title: "آدرس", text: esc(setting("contact_address")) },
    setting("contact_phone") && { ico: "☎", title: "تلفن پشتیبانی", text: `<a href="${esc(telHref(setting("contact_phone")))}">${esc(setting("contact_phone"))}</a>` },
    setting("contact_email") && { ico: "✉", title: "ایمیل", text: `<a href="mailto:${esc(setting("contact_email"))}">${esc(setting("contact_email"))}</a>` }
  ].filter(Boolean);
  document.getElementById("contactCards").innerHTML = cards.map(c => `
    <div class="info-card">
      <div class="info-ico">${c.ico}</div>
      <h3>${c.title}</h3>
      <p>${c.text}</p>
    </div>`).join("");

  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("cEmail").value.trim();
    const phone = document.getElementById("cPhone").value.trim();
    if (!email && !phone) { showToast("لطفاً ایمیل یا شماره تماس خود را وارد کنید", true); return; }
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "در حال ارسال...";
    try {
      await submitContactMessage({
        name: document.getElementById("cName").value.trim(),
        email, phone,
        subject: document.getElementById("cSubject").value.trim(),
        message: document.getElementById("cMessage").value.trim()
      });
      showToast("پیام شما با موفقیت ارسال شد ✓");
      e.target.reset();
    } catch (err) {
      showToast(err.message, true);
    } finally {
      btn.disabled = false; btn.textContent = "ارسال پیام";
    }
  });
})();
</script>
</body>
</html>
